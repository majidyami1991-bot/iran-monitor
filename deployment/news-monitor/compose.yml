services:
  news-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iran_monitor
      POSTGRES_USER: iran_monitor
      POSTGRES_PASSWORD: ${NEWS_DB_PASSWORD:?set NEWS_DB_PASSWORD in .env}
    volumes: [news-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U iran_monitor -d iran_monitor]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [news]
  news-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 3000
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [news]
  news-web:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 3000
    ports: ["127.0.0.1:3001:3000"]
    depends_on:
      news-db: {condition: service_healthy}
      news-api: {condition: service_started}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [news]
networks:
  news:
    name: iran-monitor-news_default
volumes:
  news-db-data:
