services:
  news-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: iran_monitor
      POSTGRES_USER: iran_monitor
      POSTGRES_PASSWORD: ${NEWS_DB_PASSWORD:?set NEWS_DB_PASSWORD in .env}
    volumes: [news-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U iran_monitor -d iran_monitor]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [news]
  news-api:
    build: {context: ../.., dockerfile: apps/api/Dockerfile}
    command: uvicorn main:app --host 0.0.0.0 --port 3000
    environment:
      DATABASE_URL: postgresql://iran_monitor:${NEWS_DB_PASSWORD}@news-db:5432/iran_monitor
    volumes:
      - ../../runtime/live-rss/phase-8a:/ops-evidence:ro
      - news-collector-state:/state:ro
    depends_on: {news-db: {condition: service_healthy}}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3000/api/v1/health',timeout=8).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks: [news]
  news-web:
    build: {context: ../../apps/web-next, dockerfile: Dockerfile}
    environment:
      API_ORIGIN: http://news-api:3000
      METADATA_ROOT: /metadata
    volumes:
      - ../../config/sources:/metadata:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    ports: ["127.0.0.1:3001:3000"]
    depends_on: {news-db: {condition: service_healthy}, news-api: {condition: service_healthy}}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/news').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [news]
  news-importer:
    build: {context: ../.., dockerfile: apps/api/Dockerfile}
    environment:
      DATABASE_URL: postgresql://iran_monitor:${NEWS_DB_PASSWORD}@news-db:5432/iran_monitor
    volumes: [../../data/runtime/collector:/project/data/runtime/collector:ro]
    command: python /app/import_db.py
    depends_on: {news-db: {condition: service_healthy}}
    profiles: [tools]
    networks: [news]
  news-collector:
    image: iran-monitor-news-collector:${COLLECTOR_REVISION:?set COLLECTOR_REVISION in .env}
    build: {context: ../.., dockerfile: apps/api/Dockerfile}
    labels:
      org.opencontainers.image.revision: "${COLLECTOR_REVISION:?set COLLECTOR_REVISION in .env}"
    command: [python, /app/collector.py]
    environment:
      DATABASE_URL: postgresql://iran_monitor:${NEWS_DB_PASSWORD}@news-db:5432/iran_monitor
      NEWS_COLLECTION_ENABLED: ${NEWS_COLLECTION_ENABLED:-false}
      NEWS_COLLECTION_INTERVAL_SECONDS: ${NEWS_COLLECTION_INTERVAL_SECONDS:-900}
      COLLECTOR_STATE_DIR: /state
      EXPECTED_COLLECTOR_GIT_REVISION: "${COLLECTOR_REVISION:?set COLLECTOR_REVISION in .env}"
    volumes: [news-collector-state:/state]
    depends_on: {news-db: {condition: service_healthy}}
    restart: unless-stopped
    stop_grace_period: 6m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    user: "65532:65532"
    healthcheck:
      test: [CMD, python, /app/health.py]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    profiles: [scheduler]
    networks: [news]
networks:
  news:
    name: iran-monitor-news_default
volumes:
  news-db-data:
  news-collector-state:
