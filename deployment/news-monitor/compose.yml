services:
  news-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 3000
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    networks: [news]
  news-web:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 3000
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [news-api]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    networks: [news]
networks:
  news:
    name: iran-monitor-news_default
