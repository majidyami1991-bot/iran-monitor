services:
  # ----------------------------------------------------
  # ۱. پایگاه داده PostgreSQL
  # ----------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iran_monitor_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iran_monitor}
      POSTGRES_USER: ${POSTGRES_USER:-iran_monitor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iran_monitor_secret_123}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - iran_monitor_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iran_monitor_user} -d ${POSTGRES_DB:-iran_monitor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------
  # ۲. سرویس بک‌اند (Python FastAPI)
  # ----------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iran_monitor_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iran_monitor_user}:${POSTGRES_PASSWORD:-iran_monitor_secret_123}@postgres:5432/${POSTGRES_DB:-iran_monitor}
      PORT: 8000
      API_RESPONSE_CACHE_SECONDS: 15
      AI_PROVIDER: disabled
      COLLECTOR_METADATA_DIR: /app/sources
      COLLECTOR_STATE_DIR: /state
    volumes:
      - collector_state:/state:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - iran_monitor_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health',timeout=8).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------
  # ۳. سرویس فرانت‌اند (React / Next.js)
  # ----------------------------------------------------
  frontend:
    build:
      context: apps/web-next
      dockerfile: Dockerfile
    container_name: iran_monitor_web
    restart: unless-stopped
    environment:
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      API_ORIGIN: http://backend:8000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - iran_monitor_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------
  # ۴. سرویس جمع‌آوری خودکار و مداوم اخبار (RSS Collector)
  # ----------------------------------------------------
  collector:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: iran_monitor_collector
    restart: unless-stopped
    command: ["python", "collector.py"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-iran_monitor_user}:${POSTGRES_PASSWORD:-iran_monitor_secret_123}@postgres:5432/${POSTGRES_DB:-iran_monitor}
      NEWS_COLLECTION_ENABLED: ${NEWS_COLLECTION_ENABLED:-true}
      NEWS_COLLECTION_INTERVAL_SECONDS: ${NEWS_COLLECTION_INTERVAL_SECONDS:-900}
      COLLECTOR_STATE_DIR: /state
    volumes:
      - collector_state:/state
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 6m
    healthcheck:
      test: ["CMD", "python", "health.py"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 30s
    networks:
      - iran_monitor_net

volumes:
  postgres_data:
    name: iran_monitor_pgdata
  collector_state:
    name: iran_monitor_collector_state

networks:
  iran_monitor_net:
    name: iran_monitor_network
    driver: bridge
